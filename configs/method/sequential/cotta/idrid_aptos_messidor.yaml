extends: ../../../default.yaml
output_dir: ./outputs/sequential_cotta/idrid_aptos_messidor/
model: !include ../../../model/retfound.yaml
prototype:
  temperature: 100.0

sequential:
  enabled: true
  source_dataset:
    name: idrid
    data_dir: ./data/IDRiD/
    ctta: !include ../../../cotta/idrid.yaml
  target_datasets:
    - name: aptos2019
      data_dir: ./data/APTOS2019/
      ctta: !include ../../../cotta/aptos_target_from_idrid.yaml
    - name: messidor2
      data_dir: ./data/MESSIDOR2/
      ctta: !include ../../../cotta/messidor2_target_from_aptos.yaml
  reset_weights_before_each_target: false
