# PALM experiment config (extends global defaults)
extends: ../default.yaml
output_dir: ./outputs/palm/
model: !include ../model/retfound.yaml
source_dataset: !include ../data/idrid.yaml
target_dataset: !include ../data/aptos2019.yaml
ctta:
  method: palm
  lr: 1e-4
  weight_decay: 0.0
  batch_size: 16
  temperature: 100.0
  layer_selection_threshold: null
  selection_percentile: 0.3
  sensitivity_alpha: 0.9
  consistency_lambda: 0.01
  entropy_threshold_factor: 0.4
  num_augmentations: 4
shift_detection: !include ../shift_detection/default.yaml
sequential_ctta: !include ../sequential/default.yaml
