# ViDA — IDRiD target from APTOS source (cross-domain tuning)
method: vida
adapt_every_batch: true

vida_rank1: 1
vida_rank2: 128

uncertainty_threshold: 0.2
vida_num_augmentations: 10
uncertainty_scale: 0.1

alpha_teacher: 0.99
alpha_vida: 0.8

# lowered lr from 5e-4 to 1e-4 (matching APTOS standalone)
vida_lr: 1e-4
vida_model_lr: 5e-7

ce_loss_weight: 0.3
# raised threshold from 0.5 to 0.6 for more conservative pseudo-labels
pseudo_label_threshold: 0.6

# increased restore_prob for cross-domain (more forgetting risk)
restore_prob: 0.002
