# ViDA — Messidor-2 VisionFM target from APTOS source (cross-domain tuning)
method: vida
adapt_every_batch: true

vida_rank1: 1
vida_rank2: 768

uncertainty_threshold: 0.15
vida_num_augmentations: 12
uncertainty_scale: 0.1

alpha_teacher: 0.99
alpha_vida: 0.8

vida_lr: 1e-5
vida_model_lr: 5e-7

ce_loss_weight: 0.0
pseudo_label_threshold: 0.75

restore_prob: 0.003
teacher_ensemble_weight: 0.8
class_prior_alignment_weight: 0.1
