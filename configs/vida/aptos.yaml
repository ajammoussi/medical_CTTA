method: vida
adapt_every_batch: true

# ViDA adapter ranks
vida_rank1: 1
vida_rank2: 128

# HKA uncertainty
uncertainty_threshold: 0.2
vida_num_augmentations: 10
uncertainty_scale: 0.1

# Dual EMA rates
alpha_teacher: 0.99
alpha_vida: 0.8

# Learning rates (Adam optimizer, per-param adaptive)
vida_lr: 1e-4
vida_model_lr: 5e-7

# Pseudo-label classification loss — DISABLED for overconfident medical ViTs
# CE loss reinforces wrong pseudo-labels when teacher is confidently wrong
ce_loss_weight: 0.0
pseudo_label_threshold: 0.7

# Stochastic restoration: added 0.002 to prevent catastrophic forgetting
# (CoTTA uses 0.002 for APTOS)
restore_prob: 0.002
