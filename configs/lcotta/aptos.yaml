method: lcotta
adapt_every_batch: true
# LCoTTA (NeurIPS 2025) — APTOS2019 (RETFound-DINOv2)
# V4 +6.89 QWK but cls2 -4.6. V5: halve head multiplier, add trust region 0.25 — keep LN-driven gains, stop boundary sharpening.
lcotta_optimizer: adam
lr: 2e-4
entropy_margin: 0.45
lcotta_subspace_dim: 8
lcotta_queue_length: 16
lcotta_sample_interval: 1
lcotta_cosine_filter: false
lcotta_min_confident_fraction: 0.25
lcotta_per_class_cap: 8
lcotta_adapt_head: true
lcotta_head_lr_multiplier: 5.0
lcotta_prior_alignment_weight: 0.10
lcotta_head_anchor_weight: 0.25
