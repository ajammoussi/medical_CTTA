method: lcotta
adapt_every_batch: true
# LCoTTA (NeurIPS 2025) — IDRiD (RETFound-DINOv2)
# V4 WIN +6.47 QWK (cls1 0%->20%!) but cls2 -3.1. V5: keep settings, add head trust region 0.20 to hold grade-2 boundary.
lcotta_optimizer: adam
lr: 1e-4
entropy_margin: 0.50
lcotta_subspace_dim: 4
lcotta_queue_length: 6
lcotta_sample_interval: 1
lcotta_cosine_filter: false
lcotta_min_confident_fraction: 0.25
lcotta_per_class_cap: 6
lcotta_adapt_head: true
lcotta_head_lr_multiplier: 5.0
lcotta_prior_alignment_weight: 0.15
lcotta_head_anchor_weight: 0.20
