method: lcotta
adapt_every_batch: true
# LCoTTA (NeurIPS 2025) — APTOS2019 (VisionFM)
# V4 nearly flat (-0.24). Needs more signal without cls2 damage. V5: richer set (quota 0.3125), lr 1e-4, gentle head x3 + strong trust region 0.30.
lcotta_optimizer: adam
lr: 1e-4
entropy_margin: 0.45
lcotta_subspace_dim: 8
lcotta_queue_length: 16
lcotta_sample_interval: 1
lcotta_cosine_filter: false
lcotta_min_confident_fraction: 0.3125
lcotta_per_class_cap: 5
lcotta_adapt_head: true
lcotta_head_lr_multiplier: 3.0
lcotta_prior_alignment_weight: 0.15
lcotta_head_anchor_weight: 0.30
