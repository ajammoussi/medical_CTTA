method: ecotta
adapt_every_batch: true
# EcoTTA params (arXiv 2303.01904) — VisionFM ViT-B (12 blocks)
# K=7 with last 4 partitions as single blocks so backbone.get_intermediate_layers(x, n=4)
# (classifier's 3072-dim CLS taps) still lands on blocks 8,9,10,11.
ecotta_num_partitions: 7
ecotta_partition_sizes: [2, 2, 4, 1, 1, 1, 1]
ecotta_meta_hidden_scale: 1.0       # meta MLP hidden dim = embed_dim * scale
ecotta_reg_lambda: 0.5              # self-distilled L1 weight (VisionFM: stronger reg)
entropy_margin: 0.30                # H0 = 0.3 * log(C) (EATA-style margin)
ecotta_warmup_epochs: 3
ecotta_warmup_lr: 5e-4
ecotta_tta_lr: 1e-4
ecotta_min_confident_fraction: 0.25
ecotta_per_class_cap: 4